<form (submit)="cadastrarAluno($event)">

<!--Input nome-->
    <input type="text"[formField]="alunoForm.nome"/>
    
<!--Input email-->
    <input type="email" [formField]="alunoForm.email">
    
<!--Input senha-->
    <input type="password" [formField]="alunoForm.senha">
    
<!--Input dataNascimento-->
    <input type="date" [formField]="alunoForm.dataNascimento">
    
<!--Input media-->
    <input type="text" inputmode="numeric" [formField]="alunoForm.media">

<button>Cadastrar aluno</button>

</form>
